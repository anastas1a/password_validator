<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Тестування паролів</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background-color: #f0f2f5;
      color: #333;
      line-height: 1.6;
    }
    h1 {
      color: #222;
      text-align: center;
      margin-bottom: 30px;
    }
    h2 {
      margin-top: 30px;
      border-bottom: 2px solid #ccc;
      padding-bottom: 5px;
      color: #444;
    }
    .test-container {
      background-color: #fff;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 1px 6px rgba(0, 0, 0, 0.1);
      margin-bottom: 20px;
    }
    .test-result {
      margin: 8px 0;
      padding: 10px;
      border-radius: 5px;
    }
    .test-passed {
      background-color: #d4edda;
      color: #155724;
      border-left: 5px solid #28a745;
    }
    .test-failed {
      background-color: #f8d7da;
      color: #721c24;
      border-left: 5px solid #dc3545;
    }
    .password-input-form {
      background-color: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 1px 6px rgba(0, 0, 0, 0.1);
      margin-bottom: 20px;
    }
    .input-group {
      margin-bottom: 15px;
    }
    .input-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    .input-group input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 16px;
    }
    .button-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    button {
      padding: 10px 15px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      transition: background-color 0.3s;
    }
    button:hover {
      background-color: #45a049;
    }
    .test-details {
      background-color: #f8f9fa;
      padding: 15px;
      border-radius: 5px;
      margin-top: 15px;
    }
    .sets-list {
      list-style-type: none;
      padding: 0;
    }
    .sets-list li {
      margin-bottom: 5px;
      padding: 5px;
      background-color: #f1f1f1;
      border-radius: 3px;
    }
    .passed {
      color: #28a745;
      font-weight: bold;
    }
    .failed {
      color: #dc3545;
      font-weight: bold;
    }
    @media (max-width: 600px) {
      .button-group {
        flex-direction: column;
      }
      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <h1>Тестування паролів</h1>
  
  <div id="test-container">
    <!-- Сюди вставляються форма вводу та результати з JS -->
  </div>

  <script src="../test/password-test-runner.js"></script>
</body>
</html>
