<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Продуктивність валідації паролів</title>
  <style>
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
      font-family: Arial, sans-serif;
    }
    .test-container {
      background-color: #f5f5f5;
      padding: 20px;
      border-radius: 5px;
      margin-top: 20px;
    }
    .test-title {
      font-size: 18px;
      margin-bottom: 15px;
    }
    #generate-btn {
      background-color: #4CAF50;
      color: white;
      padding: 10px 15px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
    }
    #generate-btn:hover {
      background-color: #45a049;
    }
    #time-display {
      margin-top: 15px;
      font-weight: bold;
    }
    #results-log {
      margin-top: 10px;
    }
    #results-log div {
      padding: 12px;
      margin-bottom: 8px;
      background-color: #e9e9e9;
      border-radius: 5px;
      line-height: 1.5;
    }
    code {
      background-color: #f0f0f0;
      padding: 2px 5px;
      border-radius: 3px;
      font-family: monospace;
      border: 1px solid #ddd;
      display: inline-block;
      margin: 2px 0;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .show-password-btn {
      background-color: #2196F3;
      color: white;
      border: none;
      border-radius: 3px;
      padding: 3px 8px;
      font-size: 12px;
      cursor: pointer;
      margin-left: 5px;
    }
    .show-password-btn:hover {
      background-color: #0b7dda;
    }
    .error {
      color: red;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Продуктивність валідації паролів за довжиною</h1>
    
    <div class="test-container">
      <div class="test-title">Натисніть кнопку для генерації пароля та перевірки часу:</div>
      <button id="generate-btn">Згенерувати пароль</button>
      <div id="time-display"></div>
      
      <div id="results-container" style="margin-top: 20px;">
        <h2>Результати тестування:</h2>
        <div id="results-log"></div>
      </div>
    </div>
  </div>


  <script src="../src/password-validator.js"></script>
  <script src="../test/perfomance.test.js"></script>
  
  
</body>
</html>
